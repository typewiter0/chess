<!DOCTYPE html>
<html lang="enUS">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale 1.0">
    <title>HTML Chess Bot</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #2c3e50;
        color: #efc0f1;
        margin: 0;
      }
      h1 {
        margin-bottom: 10px;
      }
      #status {
        font-size: 1.2rem;
        margin-bottom: 15px;
        font-weight: bold;
      }
      #board {
        display: grid;
        grid-template-columns: repeat(8, 60px);
        grid-template-rows: repeat(8, 60px);
        border: 4px solid  #34495e;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      }
      .square {
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        cursor: pointer;
        user-select: none;
      }
    </style>
  </head>
</html>
